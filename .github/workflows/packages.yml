name: packages

# 在各发行版容器里编译 8852cu，产出预编译包：
#   - 推 v* 标签：构建并发布到对应 GitHub Release
#   - 手动触发：只构建，产物在本次运行的 Artifacts 里下载
#
# install.sh 按 "8852cu_<uname -r>_<uname -m>.tar.gz" 查找资产，
# 找不到（内核版本对不上）时自动回退到本地源码编译。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-12,    image: 'debian:12' }
          - { name: debian-13,    image: 'debian:13' }
          - { name: ubuntu-22.04, image: 'ubuntu:22.04' }
          - { name: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { name: centos-9,     image: 'quay.io/centos/centos:stream9' }
          - { name: alma-9,       image: 'almalinux:9' }
          - { name: alpine-3.20,  image: 'alpine:3.20' }
          - { name: alpine-latest, image: 'alpine:latest' }
    steps:
      - uses: actions/checkout@v4

      - name: Build prebuilt package
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/out:/out" \
            -e DISTRO_NAME="${{ matrix.name }}" \
            "${{ matrix.image }}" \
            sh /src/packaging/build-prebuilt.sh /out

      - name: Show artifacts
        run: ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -l dist
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* --clobber
